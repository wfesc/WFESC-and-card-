<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WFESC End Card</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,"Tahoma",sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   MAIN FRAME
========================= */

.stage{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 48%,
            rgba(255,255,255,.055) 0%,
            rgba(255,255,255,.018) 18%,
            transparent 48%),
        #000;
}

/* subtle cinematic vignette */
.stage::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle,
            transparent 35%,
            rgba(0,0,0,.35) 70%,
            rgba(0,0,0,.92) 100%);
    z-index:20;
}

/* =========================
   PARTICLES
========================= */

.particles{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:0;
    animation:particleMove linear infinite;
}

@keyframes particleMove{
    0%{
        transform:translateY(30vh) scale(.2);
        opacity:0;
    }
    15%{opacity:.65}
    80%{opacity:.25}
    100%{
        transform:translateY(-35vh) scale(1);
        opacity:0;
    }
}

/* =========================
   TECH LINES
========================= */

.tech{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    animation:techIn 1s ease forwards;
    animation-delay:1.2s;
}

.line{
    position:absolute;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );
    width:55vw;
}

.line.one{
    top:30%;
    left:-15%;
    transform:rotate(-16deg);
}

.line.two{
    bottom:27%;
    right:-15%;
    transform:rotate(-16deg);
}

.line.three{
    top:50%;
    left:-30%;
    transform:rotate(0deg);
    opacity:.25;
}

@keyframes techIn{
    from{opacity:0}
    to{opacity:1}
}

/* =========================
   CENTRAL CORE
========================= */

.core{
    position:absolute;
    left:50%;
    top:43%;
    width:230px;
    height:230px;
    transform:translate(-50%,-50%) scale(.35);
    opacity:0;
    animation:coreIn 1.2s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:.35s;
}

.ring{
    position:absolute;
    inset:0;
    border:1px solid rgba(255,255,255,.18);
    border-radius:50%;
}

.ring:nth-child(1){
    animation:spin 9s linear infinite;
}

.ring:nth-child(2){
    inset:14px;
    border-style:dashed;
    opacity:.55;
    animation:spinReverse 7s linear infinite;
}

.ring:nth-child(3){
    inset:35px;
    border-color:rgba(255,255,255,.08);
}

.core::before{
    content:"";
    position:absolute;
    inset:62px;
    border-radius:50%;
    background:
        radial-gradient(circle,
            rgba(255,255,255,.18),
            rgba(255,255,255,.03) 45%,
            transparent 70%);
    box-shadow:
        0 0 35px rgba(255,255,255,.12),
        0 0 90px rgba(255,255,255,.04);
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@keyframes spinReverse{
    to{transform:rotate(-360deg)}
}

@keyframes coreIn{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.35) rotate(-25deg);
        filter:blur(12px);
    }
    70%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.08) rotate(3deg);
        filter:blur(0);
    }
    100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1) rotate(0);
    }
}

/* =========================
   WFESC LOGO
========================= */

.logo{
    position:absolute;
    left:50%;
    top:43%;
    transform:translate(-50%,-50%);
    z-index:8;
    display:flex;
    align-items:center;
    direction:ltr;
    font-family:Arial,sans-serif;
    font-weight:900;
    letter-spacing:-.07em;
    font-size:clamp(58px,18vw,105px);
    color:#fff;
    opacity:0;
    filter:blur(18px);
    animation:logoReveal 1.1s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:1.15s;
    text-shadow:
        0 0 8px rgba(255,255,255,.35),
        0 0 28px rgba(255,255,255,.12);
}

.logo span{
    display:inline-block;
}

.w{
    animation:wMove 1.1s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:1.15s;
}

.f{
    margin-left:-4px;
    animation:fBlend 1.2s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:1.3s;
}

.esc{
    opacity:0;
    transform:translateX(-18px);
    animation:escIn .8s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:1.75s;
}

@keyframes logoReveal{
    0%{
        opacity:0;
        filter:blur(18px);
        transform:translate(-50%,-50%) scale(.65);
    }
    100%{
        opacity:1;
        filter:blur(0);
        transform:translate(-50%,-50%) scale(1);
    }
}

@keyframes wMove{
    0%{transform:translateX(-70px) scaleX(.65)}
    100%{transform:translateX(0) scaleX(1)}
}

@keyframes fBlend{
    0%{
        opacity:0;
        transform:translateX(30px) scaleX(.5);
    }
    60%{
        opacity:1;
        transform:translateX(-4px) scaleX(1.08);
    }
    100%{
        opacity:1;
        transform:translateX(0) scaleX(1);
    }
}

@keyframes escIn{
    to{
        opacity:1;
        transform:translateX(0);
    }
}

/* =========================
   FLASH
========================= */

.flash{
    position:absolute;
    left:50%;
    top:43%;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    z-index:15;
    animation:flash .7s ease forwards;
    animation-delay:2.25s;
}

@keyframes flash{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(0);
    }
    30%{
        opacity:1;
        transform:translate(-50%,-50%) scale(2);
        box-shadow:
            0 0 30px #fff,
            0 0 80px rgba(255,255,255,.5);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(25);
    }
}

/* =========================
   TEXT
========================= */

.subtitle{
    position:absolute;
    left:50%;
    top:59%;
    transform:translateX(-50%);
    width:90%;
    text-align:center;
    color:rgba(255,255,255,.7);
    font-size:clamp(12px,3.4vw,17px);
    letter-spacing:.18em;
    opacity:0;
    animation:subtitleIn .9s ease forwards;
    animation-delay:2.45s;
}

@keyframes subtitleIn{
    from{
        opacity:0;
        transform:translate(-50%,12px);
        letter-spacing:.35em;
    }
    to{
        opacity:1;
        transform:translate(-50%,0);
        letter-spacing:.18em;
    }
}

.arabic{
    position:absolute;
    left:50%;
    top:64%;
    transform:translateX(-50%);
    width:90%;
    text-align:center;
    color:rgba(255,255,255,.42);
    font-size:clamp(11px,3vw,15px);
    opacity:0;
    animation:arabicIn .8s ease forwards;
    animation-delay:2.75s;
}

@keyframes arabicIn{
    from{
        opacity:0;
        transform:translate(-50%,8px);
    }
    to{
        opacity:1;
        transform:translate(-50%,0);
    }
}

/* =========================
   BOTTOM MARK
========================= */

.bottom{
    position:absolute;
    bottom:6%;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.22);
    font-size:9px;
    letter-spacing:.3em;
    direction:ltr;
    opacity:0;
    animation:bottomIn 1s ease forwards;
    animation-delay:3.1s;
}

@keyframes bottomIn{
    to{opacity:1}
}

/* =========================
   REPLAY BUTTON
========================= */

.replay{
    position:absolute;
    right:18px;
    top:18px;
    z-index:50;
    width:38px;
    height:38px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(0,0,0,.45);
    color:#fff;
    border-radius:50%;
    font-size:17px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    backdrop-filter:blur(10px);
}

.replay:active{
    transform:scale(.9);
}

/* =========================
   RESPONSIVE
========================= */

@media (orientation:landscape){
    .stage{
        width:min(56.25vh,100vw);
        height:100vh;
    }
}
</style>
</head>

<body>

<div class="stage" id="stage">

    <div class="particles" id="particles"></div>

    <div class="tech">
        <div class="line one"></div>
        <div class="line two"></div>
        <div class="line three"></div>
    </div>

    <div class="core">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>

    <div class="logo">
        <span class="w">W</span><span class="f">F</span><span class="esc">ESC</span>
    </div>

    <div class="flash"></div>

    <div class="subtitle">
        POWERED BY WFESC
    </div>

    <div class="arabic">
        ذاكرة العراق... بصورة مختلفة
    </div>

    <div class="bottom">
        WFESC • IRAQ
    </div>

    <button class="replay" onclick="replay()">↻</button>

</div>

<script>
/* =========================
   PARTICLES
========================= */

const particles = document.getElementById("particles");

for(let i=0;i<45;i++){

    const p=document.createElement("div");
    p.className="particle";

    p.style.left=(Math.random()*100)+"%";
    p.style.top=(45+Math.random()*55)+"%";

    const size=.8+Math.random()*2;
    p.style.width=size+"px";
    p.style.height=size+"px";

    p.style.animationDuration=(3+Math.random()*5)+"s";
    p.style.animationDelay=(Math.random()*4)+"s";

    particles.appendChild(p);
}

/* =========================
   REPLAY
========================= */

function replay(){

    const stage=document.getElementById("stage");

    stage.style.display="none";

    void stage.offsetWidth;

    stage.style.display="block";

    document.querySelectorAll(".particle").forEach(p=>{
        p.style.animation="none";
        void p.offsetWidth;
        p.style.animation="";
    });
}

/* =========================
   AUTO REPLAY
   every 8 seconds
========================= */

setInterval(()=>{
    replay();
},8000);
</script>

</body>
</html>
